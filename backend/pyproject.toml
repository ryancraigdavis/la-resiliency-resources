[project]
name = "la-resiliency"
version = "0.1.0"
description = "LA Resiliency Resources: data pipeline (Sheet sync, translation, export)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6",
    "httpx>=0.28",
    "opencc>=1.4",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.scripts]
la-resiliency = "la_resiliency.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "la_resiliency"
module-root = "src"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "PLR"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-returns = 1
max-branches = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "C90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
