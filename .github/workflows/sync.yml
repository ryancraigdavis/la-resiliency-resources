name: Sync from Google Sheet

on:
  schedule:
    - cron: "17 10 * * *" # every day, around 3am in Los Angeles
  workflow_dispatch:
    inputs:
      mode:
        description: "claude-code uses the Claude subscription token; direct/batch use an API key"
        type: choice
        options: [claude-code, direct, batch]
        default: claude-code

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          if [ -n "$SHEET_CSV_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SHEET_CSV_URL is not set yet, so there is nothing to sync."
          fi

  sync:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Pull the Sheet, translate changes, check links
        working-directory: backend
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          # From `claude setup-token` (valid for one year). Used by --mode claude-code.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only needed for --mode direct or batch.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run la-resiliency sync --mode "${{ inputs.mode || 'claude-code' }}" --report "$RUNNER_TEMP/sync-report.md"

      - name: Show the report on the run page
        if: always()
        run: cat "$RUNNER_TEMP/sync-report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sheet-sync
          delete-branch: true
          title: Resource updates from the Google Sheet
          body-path: ${{ runner.temp }}/sync-report.md
          commit-message: Sync resources from the Google Sheet
          add-paths: |
            data/resources.yaml
            data/i18n/*.json
