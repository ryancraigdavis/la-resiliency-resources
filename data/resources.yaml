- id: line-standing-apps
  categories: [jobs]
  name: Line-standing apps (InLine4You, Spotblaze, TaskRabbit)
  description: Earn money waiting in line for someone at a restaurant, concert, sports game, or other event.
  last_verified: 2026-06-30

- id: delivery-apps
  categories: [jobs]
  name: Delivery apps (Instacart, Uber Eats, Grubhub)
  description: Earn money delivering groceries, restaurant meals, and other food orders.
  tip: Instacart drivers usually make $8 to $25 an hour, depending on location.
  volatile: true
  last_verified: 2026-06-30

- id: website-testing
  categories: [jobs]
  name: Website and app testing (UserTesting, Userlytics, uTest)
  description: Earn money giving feedback on websites and apps. Businesses use these companies to learn how to improve their products.
  how_to_get_it: Sign up for notifications about tests that match your skills and interests.
  tip: Testers typically earn about $20 to $39 an hour, according to Glassdoor.
  volatile: true
  last_verified: 2026-06-30

- id: mystery-shopping
  categories: [jobs]
  name: Mystery shopping (BestMark, Confero, IntelliShop, Market Force, Second to None)
  description: Get paid to shop at stores, eat at restaurants, or stay at hotels and report on customer service, cleanliness, and product quality. You can also find gigs through MSPA Americas, a trade group.
  how_to_get_it: Most companies have you pay for the product or service first and reimburse you afterward. Typical pay is $5 to $25 per gig.
  tip: "Watch out for scams: stick to established companies, communicate only through official channels, and never accept offers that ask you to cash checks or send money in advance."
  last_verified: 2026-06-30

- id: transcription
  categories: [jobs]
  name: Transcription work (Rev, TranscribeMe, GoTranscript, and more)
  description: Get paid to type out audio and video recordings like business calls, meetings, and court hearings. Companies include Rev, Speechpad, TranscribeMe, Quicktate, CastingWords, GoTranscript, Transcription HUB, and SpeakWrite.
  how_to_get_it: "Most pay per audio minute: Speechpad $0.25–$1, Rev $0.30–$1.10, GoTranscript up to $1.75. Legal transcription pays more, such as $15–$40 per audio hour at TranscribeMe."
  tip: Improve your typing speed and accuracy, use practice tests, and move into legal or medical transcription for higher pay.
  volatile: true
  last_verified: 2026-06-30

- id: sidehusl
  categories: [jobs]
  name: SideHusl.com
  description: Reviews and ratings of money-making opportunities, so you can pick a side gig with confidence.
  last_verified: 2026-06-30

