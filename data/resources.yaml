# ---------------------------------------------------------------- Benefits & health
- id: calfresh
  categories: [benefits-health, food]
  name: CalFresh (SNAP / EBT / food stamps)
  url: https://www.benefitscal.com
  phones:
    - number: (877) 847-3663
  description: Monthly money for food, loaded onto an EBT card.
  who_its_for: "U.S. citizens and qualified legal residents with low income. Monthly income limits: 1 person $2,878; 2 people $3,894; 3 people $4,910. Special consideration for seniors and students."
  how_to_get_it: Apply online at BenefitsCal or by phone. Adults 18–50 without children must work 20 hours a week.
  tip: Not eligible because of immigration status? See CFAP, the California Food Assistance Program.
  cost: free
  volatile: true
  last_verified: 2026-06-30

- id: cfap
  categories: [benefits-health, food]
  name: CFAP — California Food Assistance Program
  url: https://www.benefitscal.com
  phones:
    - number: (877) 847-3663
  description: State-funded food help with the same monthly benefit as CalFresh.
  who_its_for: Immigrants who don't qualify for CalFresh because of their immigration status.
  how_to_get_it: Apply at BenefitsCal, by phone, or at your local DPSS office. If you lose CalFresh because your immigration status changed, the county automatically checks you for CFAP. No separate application is needed.
  status_ok: true
  cost: free
  last_verified: 2026-06-30

- id: wic
  categories: [benefits-health, food]
  name: WIC — Women, Infants & Children
  url: https://www.phfewic.org
  description: An EBT card for healthy foods, plus nutrition support.
  who_its_for: Low-income pregnant or breastfeeding women, women who recently lost a child, and children under 5.
  how_to_get_it: You automatically qualify if you already get CalFresh.
  audience: families
  cost: free
  last_verified: 2026-06-30

- id: capi
  categories: [benefits-health]
  name: CAPI — Cash Assistance Program for Immigrants
  url: https://dpss.lacounty.gov
  description: Monthly cash assistance, the same amount as SSI.
  who_its_for: Immigrants who would qualify for SSI but can't get it because of their immigration status.
  how_to_get_it: You must show proof that you applied for SSI.
  status_ok: true
  last_verified: 2026-06-30

- id: medi-cal-full-scope
  categories: [benefits-health]
  name: Full Scope Medi-Cal
  description: Free comprehensive health insurance regardless of immigration status. Covers doctor visits, dental, vision, prescriptions, in-home care, and transportation.
  who_its_for: Adults age 50 and older.
  tip: "Getting Medi-Cal will NOT affect your immigration status. Narrow exception: if Medi-Cal pays for long-term nursing home care, talk to an immigration attorney."
  status_ok: true
  cost: free
  volatile: true
  last_verified: 2026-06-30

