# ---------------------------------------------------------------- Start here
- id: 211-la
  categories: [start-here]
  name: 211 LA
  url: https://211la.org
  phones:
    - number: "211"
      label: Call or text, 24/7
  description: LA County's free helpline connecting residents to housing, food, health care, emergency financial aid, and social services. Live Community Resource Advisors assess your situation and make referrals.
  how_to_get_it: Call or text 211 any time, day or night.
  tip: Use 211 as your first call when you don't know where to start.
  cost: free
  multilingual: true
  urgent: true
  last_verified: 2026-06-30

- id: findhelp
