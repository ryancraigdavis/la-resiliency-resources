# ---------------------------------------------------------------- Jobs: side gigs
- id: taskrabbit
  categories: [jobs]
  name: TaskRabbit
  url: https://www.taskrabbit.com/locations/los-angeles
  description: Get paid for local, in-person tasks like assembling furniture, hanging pictures, organizing garages, gardening, handywork, delivery, and waiting in line.
  how_to_get_it: Clients choose between several helpers, so make your profile stand out with a good photo and before-and-after pictures of your work.
  tip: Line-standing tasks pay about $27 an hour on average.
